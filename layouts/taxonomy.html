{{ define "main" }}
<div class="wrap narrow">
  <header class="list-head"><h1>Categories</h1><p class="lede">Pick a topic to see every story we have published on it.</p></header>
  <ul class="term-list">
    {{ range .Pages.ByTitle }}<li><a href="{{ .RelPermalink }}">{{ .Title }}</a><span>{{ len .Pages }}</span></li>{{ end }}
  </ul>
</div>
{{ end }}
