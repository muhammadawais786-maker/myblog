{{ $p := . }}
{{ if gt $p.TotalPages 1 }}
<nav class="pager" aria-label="Pages">
  {{ if $p.HasPrev }}<a class="btn" href="{{ $p.Prev.URL }}">Newer posts</a>{{ else }}<span></span>{{ end }}
  <span class="pager-count">Page {{ $p.PageNumber }} of {{ $p.TotalPages }}</span>
  {{ if $p.HasNext }}<a class="btn" href="{{ $p.Next.URL }}">Older posts</a>{{ else }}<span></span>{{ end }}
</nav>
{{ end }}
